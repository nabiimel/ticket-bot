name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci
      - name: Allow native build scripts
        run: |
          npm approve-scripts better-sqlite3 || true
          npm approve-scripts esbuild || true
          npm rebuild better-sqlite3

      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Test
        run: npm test

      - name: Build dashboard
        run: npm run build --workspace @ticketbot/dashboard
        env:
          SKIP_ENV_VALIDATION: "1"

  # Build the Docker image once (on GitHub's runners) and push it to GHCR, so the
  # droplet only has to `docker compose pull` instead of building on a 1 GB box.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional hands-off deploy. Enable by setting repo variable AUTO_DEPLOY=true and
  # secrets DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY. Otherwise deploy manually:
  #   ssh <droplet> 'cd ~/ticket-bot && git pull && docker compose pull && docker compose up -d'
  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/ticket-bot
            git pull --ff-only
            docker compose pull
            docker compose up -d
