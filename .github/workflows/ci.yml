name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci
      - name: Allow native build scripts
        run: |
          npm approve-scripts better-sqlite3 || true
          npm approve-scripts esbuild || true
          npm rebuild better-sqlite3

      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Test
        run: npm test

      - name: Build dashboard
        run: npm run build --workspace @ticketbot/dashboard
        env:
          SKIP_ENV_VALIDATION: "1"

  # Build the Docker image once (on GitHub's runners) and push it to GHCR, so the
  # droplet only has to `docker compose pull` instead of building on a 1 GB box.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional hands-off deploy. Enable by setting repo variable AUTO_DEPLOY=true and
  # secrets DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY. Otherwise deploy manually:
  #   ssh <droplet> 'cd ~/ticket-bot && git pull && docker compose pull \
  #     && docker compose --profile tools run --rm migrate && docker compose up -d \
  #     && docker image prune -af'
  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/ticket-bot
            git pull --ff-only
            docker compose pull
            docker compose --profile tools run --rm migrate
            docker compose up -d
            docker compose ps
            # docker compose up -d succeeding only means the containers
            # started, not that they came up working — without this, a
            # container that starts and then fails its healthcheck (bad
            # config, crash loop, out-of-disk, etc.) looks identical to a
            # successful deploy from this script's point of view. Wait for
            # both services to actually report healthy, or fail loudly.
            for i in $(seq 1 30); do
              bot_status=$(docker inspect -f '{{.State.Health.Status}}' ticket-bot-bot-1 2>/dev/null || echo "missing")
              dash_status=$(docker inspect -f '{{.State.Health.Status}}' ticket-bot-dashboard-1 2>/dev/null || echo "missing")
              if [ "$bot_status" = "healthy" ] && [ "$dash_status" = "healthy" ]; then
                echo "Both services healthy."
                break
              fi
              if [ "$i" = "30" ]; then
                echo "Services did not become healthy in time (bot: $bot_status, dashboard: $dash_status)" >&2
                docker compose logs --tail 50
                exit 1
              fi
              sleep 5
            done
            # Old image layers pile up on every deploy otherwise (each push
            # leaves the previous version's layers behind) and can fill a
            # small droplet's disk over enough deploys. Safe to run
            # unconditionally: prune never removes an image still in use by
            # an existing container.
            docker image prune -af
